name: SystemStatus
options:
  bundleIdPrefix: com.chengwang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 6NZHLN3MUD
    CODE_SIGN_STYLE: Automatic
targets:
  SystemStatus:
    type: application
    platform: iOS
    sources: [SystemStatus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengwang.systemstatus
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 系统状态
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SystemStatusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SystemStatusTests]
    dependencies: [{target: SystemStatus}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SystemStatusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SystemStatusUITests]
    dependencies: [{target: SystemStatus}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SystemStatus:
    build:
      targets:
        SystemStatus: all
    test:
      targets: [SystemStatusTests, SystemStatusUITests]
